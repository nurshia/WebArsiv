<div id="app" class="app">
  <!-- ============ sol araç çubuğu ============ -->
  <nav id="rail" class="rail" aria-label="Araçlar">
    <div class="brand" aria-hidden="true"><b>I.</b><span>Dünya<br>Savaşı</span></div>
    <button class="rb" data-mode="anlatim" aria-pressed="true" title="Aşamaların anlatımı (A)"><svg><use href="#i-book"/></svg><span>Anlatım</span></button>
    <button class="rb" data-mode="cephe" aria-pressed="false" title="Cepheler (C)"><svg><use href="#i-front"/></svg><span>Cepheler</span></button>
    <button class="rb" data-sheet="kisiler" title="Kişiler (K)"><svg><use href="#i-people"/></svg><span>Kişiler</span></button>
    <button class="rb" data-sheet="notlar" title="Ders notu (N)"><svg><use href="#i-note"/></svg><span>Ders notu</span></button>
    <button class="rb" data-tool="sinav" aria-pressed="false" title="Sınıf soruları (S)"><svg><use href="#i-quiz"/></svg><span>Soru</span></button>
    <button class="rb" data-tool="kalem" aria-pressed="false" title="Harita üstüne çizim (D)"><svg><use href="#i-pen"/></svg><span>Kalem</span></button>
    <div class="rail-sp"></div>
    <button class="rb sm" data-pop="katman" title="Katmanlar (L)"><svg><use href="#i-layers"/></svg><span>Katmanlar</span></button>
    <button class="rb sm" data-pop="ayar" title="Görünüm ve yazı boyutu"><svg><use href="#i-set"/></svg><span>Görünüm</span></button>
    <button class="rb sm" id="bFull" title="Tam ekran (F)"><svg><use href="#i-full"/></svg><span>Tam ekran</span></button>
  </nav>

  <!-- ============ harita ============ -->
  <main id="stage" class="stage" aria-label="Harita">
    <div id="cam" class="cam">
      <svg id="svBase" class="sv" aria-hidden="true"></svg>
      <svg id="svOver" class="sv over" role="group" aria-label="Harita işaretleri"></svg>
      <svg id="svInk" class="sv ink" aria-hidden="true"></svg>
    </div>

    <div class="stamp" id="stamp" aria-live="polite">
      <i id="stampK"></i><b id="stampYr"></b><span id="stampNm"></span>
    </div>

    <div class="zoom" role="group" aria-label="Yakınlaştırma">
      <button class="zb" id="zIn" aria-label="Yakınlaştır"><svg><use href="#i-plus"/></svg></button>
      <button class="zb" id="zOut" aria-label="Uzaklaştır"><svg><use href="#i-minus"/></svg></button>
      <button class="zb" id="zHome" aria-label="Aşamanın görünümüne dön"><svg><use href="#i-home"/></svg></button>
    </div>

    <section class="legend" id="legend" aria-label="Lejant">
      <button class="lg-hd" id="lgHd" aria-expanded="true"><span>Lejant</span><svg><use href="#i-down"/></svg></button>
      <div class="lg-body" id="lgBody"></div>
    </section>
    <div class="scale" id="scale" aria-hidden="true"><i id="scaleBar"></i><span id="scaleTxt"></span></div>

    <div class="caption" id="caption" hidden></div>
    <div class="quiz" id="quiz" hidden></div>
    <div class="penbar" id="penbar" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <!-- ============ yan panel ============ -->
  <aside id="panel" class="panel" aria-label="Açıklamalar">
    <div class="p-tabs" id="pTabs" role="tablist"></div>
    <div class="p-body" id="pBody" tabindex="-1"></div>
    <div class="p-foot" id="pFoot">
      <button class="pf-next" id="pNext"></button>
      <button class="pn" id="pUp" aria-label="Yukarı kaydır"><svg><use href="#i-up"/></svg></button>
      <button class="pn" id="pDown" aria-label="Aşağı kaydır"><svg><use href="#i-down"/></svg></button>
    </div>
  </aside>

  <!-- ============ zaman çizelgesi ============ -->
  <footer id="tl" class="tl">
    <button class="tl-back" id="tBack" hidden><svg><use href="#i-back"/></svg><span>Genel<br>harita</span></button>
    <button class="tl-arr" id="tPrev" aria-label="Önceki aşama"><svg><use href="#i-prev"/></svg></button>
    <ol class="tl-steps" id="tSteps" aria-label="Savaşın aşamaları"></ol>
    <button class="tl-arr" id="tNext" aria-label="Sonraki aşama"><svg><use href="#i-next"/></svg></button>
    <button class="tl-panel" id="bPanel" aria-pressed="false" title="Paneli gizle / göster (P)"><svg><use href="#i-panel"/></svg><span>Sunum</span></button>
  </footer>
</div>

<!-- ============ örtü sayfa (kişiler, ders notu) ============ -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-in">
    <header class="sh-hd"><h2 id="shTitle"></h2><button class="x" id="shX" aria-label="Kapat"><svg><use href="#i-close"/></svg></button></header>
    <div class="sh-body" id="shBody"></div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>

<noscript><p class="nojs">Bu harita JavaScript gerektirir.</p></noscript>
<script src="geo.js"></script>
<script src="data.js"></script>
<script src="events.js"></script>
<script src="lines.js"></script>
<script src="lesson.js"></script>
<script src="canakkale.js"></script>
<script src="app.js"></script>
</body>
</html>
