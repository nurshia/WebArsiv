<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="">
<meta property="og:title" content="Trablusgarp Savaşı — interaktif dönem haritası">
<meta property="og:description" content="1911–1912 Trablusgarp Savaşı'nı anlatmak için hazırlanmış interaktif ders haritası.">
<meta property="og:type" content="website">
<title>Trablusgarp 1911</title>
<meta name="description" content="Trablusgarp Savaşı'nın interaktif dönem haritası: 1911 Osmanlı sınırları, İtalyan çıkarması, cepheler ve Uşi Antlaşması." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Vollkorn:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* ============ jetonlar ============ */
:root{
  --paper:#f3efe6; --plate:#e7e1d1; --plate-2:#ded7c4;
  --sea:#aecdd9; --sea-ink:#7aa2b1; --grat:#99bfcd;
  --ink:#22292e; --ink-2:#4e5a64; --ink-3:#7d8892; --rule:#d2cab6;
  --panel:#fbf9f3; --panel-2:#f1ece0; --sunken:#e9e3d5;
  --osm:#c0503f; --osm-w:#e2a68b; --ita:#2d6d9f; --ita-w:#8ab4d2;
  --gbr:#d9a441; --fra:#8b7bb0; --aut:#9c8467; --bal:#7fa46a;
  --rus:#7c8a99; --alb:#c08a3e; --oth:#c6bda8; --esp:#bba98d;
  --accent:#c2551f; --accent-soft:#e8ddcc;
  --wall:#6f5e46; --hi:#fffaf0;
  --sel:#1d2226;
  --shadow:0 1px 2px rgba(45,38,25,.07), 0 8px 24px -12px rgba(45,38,25,.22);
  --shadow-lift:0 2px 4px rgba(45,38,25,.09), 0 18px 40px -16px rgba(45,38,25,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12161a; --plate:#1e242a; --plate-2:#252c33;
    --sea:#12313e; --sea-ink:#33697e; --grat:#255060;
    --ink:#eae5d8; --ink-2:#a9b2b8; --ink-3:#78838b; --rule:#2d353c;
    --panel:#171c21; --panel-2:#1f262c; --sunken:#11161a;
    --osm:#cd6350; --osm-w:#96503c; --ita:#4d8ac2; --ita-w:#2d5a82;
    --gbr:#dcaf60; --fra:#a291c0; --aut:#a8927a; --bal:#8fb07b;
    --rus:#8595a6; --alb:#c99d55; --oth:#5a636a; --esp:#6f665a;
    --accent:#e9773f; --accent-soft:#2a2019;
    --wall:#05080a; --hi:#5e727d;
    --sel:#f2ede0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.8);
    --shadow-lift:0 2px 4px rgba(0,0,0,.55), 0 18px 40px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161a; --plate:#1e242a; --plate-2:#252c33;
  --sea:#12313e; --sea-ink:#33697e; --grat:#255060;
  --ink:#eae5d8; --ink-2:#a9b2b8; --ink-3:#78838b; --rule:#2d353c;
  --panel:#171c21; --panel-2:#1f262c; --sunken:#11161a;
  --osm:#cd6350; --osm-w:#96503c; --ita:#4d8ac2; --ita-w:#2d5a82;
  --gbr:#dcaf60; --fra:#a291c0; --aut:#a8927a; --bal:#8fb07b;
  --rus:#8595a6; --alb:#c99d55; --oth:#5a636a; --esp:#6f665a;
  --accent:#e9773f; --accent-soft:#2a2019;
  --wall:#05080a; --hi:#5e727d;
  --sel:#f2ede0;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.55), 0 18px 40px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{box-sizing:border-box;height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:Archivo,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4{font-family:Vollkorn,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:where(button,[tabindex],a):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ============ kabuk ============ */
.app{
  height:100%; display:grid;
  grid-template-columns:minmax(0,1fr) 384px;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--paper);
}

/* --- üst şerit --- */
.topbar{
  grid-column:1/-1; display:flex; align-items:center; gap:16px;
  padding:10px 18px;
  border-bottom:1px solid var(--rule); background:var(--panel);
  flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:19px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;white-space:nowrap}
.spacer{flex:1 1 auto}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border:1px solid var(--rule);border-radius:7px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--panel);
  transition:background .15s,border-color .15s,color .15s;
}
.tbtn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--ink-3)}
.tbtn[aria-pressed="true"]{background:var(--sel);color:var(--panel);border-color:var(--sel)}
.tbtn svg{width:14px;height:14px;flex:none}

/* --- harita sahnesi --- */
.stage{grid-column:1;grid-row:2;position:relative;overflow:hidden;background:var(--sea)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
/* kabartma: yan duvar (aşağı kaydırılmış koyu siluet) ve üst kenar ışığı */
#wall path{fill:var(--wall);stroke:none}
#wall{opacity:.92;pointer-events:none}
#hi path{fill:var(--hi);stroke:none}
#hi{opacity:.34;pointer-events:none}
#land{filter:drop-shadow(0 1.6px 1.4px rgba(40,28,14,.26))}
.terr{fill:var(--oth);stroke:rgba(0,0,0,.28);stroke-width:.6;vector-effect:non-scaling-stroke;
  transition:fill .45s ease, transform .2s cubic-bezier(.2,.9,.3,1.2), filter .2s ease}
#map.boot .terr{transition:none}
:root[data-theme="dark"] .terr,:root:not([data-theme="light"]) .terr{stroke:rgba(0,0,0,.45)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .terr{stroke:rgba(0,0,0,.28)}}
.terr.hit{cursor:pointer}
/* 3B kaldırma: --lf ekran pikseli sabit kalsın diye zoom ile ters ölçeklenir */
.terr.hit:hover{
  transform:translate(calc(var(--lf,4) * -.35px),calc(var(--lf,4) * -1.6px));
  filter:brightness(1.08) drop-shadow(calc(var(--lf,4) * .5px)
         calc(var(--lf,4) * 1.7px) calc(var(--lf,4) * 1.3px) rgba(40,28,14,.55));
}
.terr.on{
  stroke:var(--sel);stroke-width:2;
  transform:translate(calc(var(--lf,4) * -.8px),calc(var(--lf,4) * -3.6px));
  filter:brightness(1.06) drop-shadow(calc(var(--lf,4) * 1.1px)
         calc(var(--lf,4) * 3.8px) calc(var(--lf,4) * 2.4px) rgba(40,28,14,.6));
}
.terr.on:hover{
  transform:translate(calc(var(--lf,4) * -.95px),calc(var(--lf,4) * -4.2px));
}
.e-osm{fill:var(--osm)} .e-osmn{fill:var(--osm-w)} .e-ita{fill:var(--ita)}
.e-itan{fill:var(--ita-w)} .e-gbr{fill:var(--gbr)} .e-fra{fill:var(--fra)}
.e-aut{fill:var(--aut)} .e-bal{fill:var(--bal)} .e-rus{fill:var(--rus)}
.e-alb{fill:var(--alb)} .e-esp{fill:var(--esp)} .e-oth{fill:var(--oth)}
#grat line{stroke:var(--grat);stroke-width:.5;vector-effect:non-scaling-stroke;opacity:.65}
#grat line.maj{opacity:1;stroke-width:.8}

#focus path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:7 4.5;
  vector-effect:non-scaling-stroke;pointer-events:none;opacity:.9}
.zone{fill:var(--ita);stroke:none}
#zones{opacity:.62;transition:opacity .4s ease;pointer-events:none}
#rezones{opacity:.8;pointer-events:none}
.rzone{fill:url(#senusi);stroke:var(--ink);stroke-width:1.2;stroke-dasharray:6 4;
  stroke-opacity:.45;vector-effect:non-scaling-stroke}
#claim{opacity:.85;pointer-events:none}
#claim path{fill:url(#claimhatch);stroke:none}

.route{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round;
  stroke-linejoin:round}
.route.land{stroke:var(--osm);stroke-dasharray:7 5}
.route.sea{stroke:var(--ita);stroke-dasharray:2 6}
.route-hd{fill:none;stroke-width:9;stroke:transparent;vector-effect:non-scaling-stroke;cursor:pointer}

/* --- etiketler --- */
#labels text,#modern text{font-family:Vollkorn,"Iowan Old Style",Palatino,Georgia,serif;
  paint-order:stroke fill; stroke:var(--plate); stroke-width:3.2px; stroke-linejoin:round;
  pointer-events:none; user-select:none}
.lb-terr{font-size:16px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  fill:var(--ink)}
.lb-terr.sm{font-size:11.5px;letter-spacing:.11em;fill:var(--ink-2)}
.lb-terr.md{font-size:12.5px;letter-spacing:.13em}
.lb-emp{font-size:21px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  fill:var(--ink);opacity:.72}
.lb-reg{font-size:13.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  fill:#fff;stroke:rgba(0,0,0,.5);stroke-width:2.8px}
.lb-sea{font-size:13px;font-style:italic;font-weight:500;letter-spacing:.24em;
  fill:var(--sea-ink);stroke:var(--sea);text-transform:uppercase}
.lb-mod{font-family:Archivo,sans-serif !important;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;fill:var(--ink-2);stroke:var(--plate);stroke-width:3px;text-transform:uppercase}
#modern{opacity:0;transition:opacity .3s}
#modern.on{opacity:1}

/* --- olay işaretleri --- */
.ev{cursor:pointer}
.ev-dot{fill:var(--accent);stroke:#fff;stroke-width:1.6}
:root[data-theme="dark"] .ev-dot,:root:not([data-theme="light"]) .ev-dot{stroke:#0d1114}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .ev-dot{stroke:#fff}}
.ev-ring{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:0}
.ev:hover .ev-ring,.ev.on .ev-ring{opacity:.85}
.ev.on .ev-dot{stroke-width:2.4}
.ev-city{fill:var(--ink)}
.ev-lbl{font-family:Archivo,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.02em;
  fill:var(--ink);paint-order:stroke fill;stroke:var(--plate);stroke-width:3px;
  stroke-linejoin:round;pointer-events:none;user-select:none}
.ev-lbl.sea{stroke:var(--sea)}
#map:not(.z1) .lod1{display:none}
#map:not(.z2) .lodz{display:none}

/* --- harita üstü kontroller --- */
.ov{position:absolute;z-index:5}
.ov-tl{top:12px;left:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ov-bl{bottom:12px;left:12px;display:flex;flex-direction:column;gap:8px;
  align-items:flex-start;max-height:calc(100% - 24px)}
.ov-tr{top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.zbtn{width:32px;height:32px;display:grid;place-items:center;background:var(--panel);
  border:1px solid var(--rule);border-radius:7px;box-shadow:var(--shadow);
  font-size:15px;font-weight:600;color:var(--ink-2);line-height:1}
.zbtn:hover{background:var(--panel-2);color:var(--ink)}
.zbtn.wide{width:auto;padding:0 10px;font-size:11.5px;font-weight:600;letter-spacing:.03em}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:9px;
  box-shadow:var(--shadow);padding:11px 13px}
.legend{max-width:236px;padding:9px 12px 10px}
.legend h4,.ly-card h4{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-family:Archivo,sans-serif;font-weight:700;margin-bottom:8px}
.lg-hd{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.lg-hd h4{margin-bottom:0}
.lg-hd .car{font-size:10px;color:var(--ink-3);transition:transform .2s}
.legend[data-collapsed] .lg-hd .car{transform:rotate(-90deg)}
.legend[data-collapsed] #legendRows,.legend[data-collapsed] .lg-foot{display:none}
#legendRows{margin-top:7px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2);
  padding:2px 0;line-height:1.32}
.sw{width:16px;height:11px;border-radius:2.5px;flex:none;border:1px solid rgba(0,0,0,.22)}
.sw.hatch{background-image:repeating-linear-gradient(45deg,var(--ita) 0 2px,transparent 2px 7px);
  background-color:var(--osm)}
.sw.zone{background:var(--ita);opacity:.62}
.sw.rz{background-image:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px);
  background-color:transparent;border-style:dashed;opacity:.8}
.sw.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);border-color:rgba(0,0,0,.3)}
.lg-foot{margin-top:8px;padding-top:7px;border-top:1px solid var(--rule);
  font-size:10.5px;color:var(--ink-3);line-height:1.4}

.scalebar{display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:6px 9px 7px;
  box-shadow:var(--shadow)}
.scalebar .bar{height:5px;border:1px solid var(--ink-2);border-top:0;position:relative;
  min-width:40px;transition:width .2s}
.scalebar .bar::after{content:"";position:absolute;inset:0 50% 0 0;background:var(--ink-2)}
.scalebar span{font-size:10px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;
  font-variant-numeric:tabular-nums}

/* --- ipucu --- */
#tip{position:absolute;z-index:9;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--sel);color:var(--panel);font-size:11.5px;font-weight:500;
  padding:4px 8px;border-radius:5px;white-space:nowrap;box-shadow:var(--shadow);
  transform:translate(-50%,-140%)}
#tip.on{opacity:1}
#tip b{font-weight:700}
#tip i{font-style:normal;opacity:.7;font-size:10.5px;display:block}

/* ============ panel ============ */
.panel{grid-column:2;grid-row:2;background:var(--panel);border-left:1px solid var(--rule);
  overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel-scroll{overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 26px;flex:1;min-height:0}
.pnl-back{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  color:var(--ink-3);letter-spacing:.04em;margin-bottom:12px;padding:3px 0}
.pnl-back:hover{color:var(--accent)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
.panel h2{font-size:23px;line-height:1.2;margin-bottom:4px}
.panel h3{font-size:12px;font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:20px 0 9px}
.date-line{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.lede{font-size:14.5px;line-height:1.62;color:var(--ink-2);margin-bottom:4px}
.body-txt p{font-size:13.5px;line-height:1.66;color:var(--ink-2);margin-bottom:10px}
.body-txt b,.lede b{color:var(--ink);font-weight:600}
.body-txt em{font-style:italic}

.facts{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.fact{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--rule);font-size:12.5px;align-items:baseline}
.fact dt{color:var(--ink-3);font-weight:600;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase}
.fact dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}

.ev-list{display:flex;flex-direction:column;gap:1px}
.ev-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;
  text-align:left;width:100%;padding:8px 9px;border-radius:7px;
  transition:background .14s;border-left:2px solid transparent}
.ev-item:hover{background:var(--panel-2);border-left-color:var(--accent)}
.ev-item .d{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.ev-item .t{font-size:12.5px;color:var(--ink);line-height:1.4}
.ev-item .t small{display:block;color:var(--ink-3);font-size:11px;margin-top:1px}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--panel-2);color:var(--ink-2);border:1px solid var(--rule);letter-spacing:.02em}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip button{display:block}
.side-note{background:var(--sunken);border-left:2.5px solid var(--accent);border-radius:0 7px 7px 0;
  padding:11px 13px;font-size:12.5px;line-height:1.6;color:var(--ink-2);margin:14px 0 4px}
.side-note b{color:var(--ink)}
.owner-tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:7px;background:var(--panel-2);border:1px solid var(--rule);
  color:var(--ink);margin-bottom:12px}
.owner-tag .sw{width:13px;height:13px;border-radius:3px}

.person{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--rule);align-items:start}
.person .ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--osm);color:#fff;font-family:Vollkorn,Georgia,serif;font-size:14px;
  font-weight:700;letter-spacing:.02em}
.person h4{font-size:14px;margin-bottom:1px}
.person .role{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:4px}
.person p{font-size:12.5px;color:var(--ink-2);line-height:1.55}

/* ============ kronoloji rayı ============ */
.timeline{grid-column:1/-1;grid-row:3;background:var(--panel);border-top:1px solid var(--rule);
  padding:10px 18px 12px;
  display:flex;align-items:center;gap:14px}
.tl-nav{width:30px;height:30px;border:1px solid var(--rule);border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--ink-2);font-size:14px;background:var(--panel)}
.tl-nav:hover:not(:disabled){background:var(--sel);color:var(--panel);border-color:var(--sel)}
.tl-nav:disabled{opacity:.3;cursor:default}
.tl-track{flex:1;display:flex;gap:0;min-width:0;position:relative}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:15px;height:1px;
  background:var(--rule)}
.tl-step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:0 2px;position:relative;text-align:center}
.tl-step .pin{width:11px;height:11px;border-radius:50%;background:var(--panel);
  border:2px solid var(--rule);margin-top:9.5px;flex:none;z-index:1;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease}
.tl-step:hover .pin{border-color:var(--ink-3)}
.tl-step[aria-current="true"] .pin{background:var(--accent);border-color:var(--accent);
  transform:scale(1.35);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.tl-step .yr{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-step .nm{font-size:11.5px;font-weight:500;color:var(--ink-3);line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  max-width:14ch}
.tl-step[aria-current="true"] .yr{color:var(--accent)}
.tl-step[aria-current="true"] .nm{color:var(--ink);font-weight:600}
.tl-step.done .pin{background:var(--ink-3);border-color:var(--ink-3)}

/* ============ örtü sayfa ============ */
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;
  background:color-mix(in srgb,var(--sel) 52%,transparent);backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet-in{background:var(--panel);border:1px solid var(--rule);border-radius:13px;
  box-shadow:var(--shadow-lift);width:min(680px,100%);max-height:min(82vh,780px);
  display:flex;flex-direction:column;overflow:hidden}
.sheet-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--rule)}
.sheet-hd h2{font-size:19px;flex:1}
.sheet-bd{overflow-y:auto;padding:18px 20px 24px}
.x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:17px;
  color:var(--ink-3);flex:none}
.x:hover{background:var(--panel-2);color:var(--ink)}
.q-list{counter-reset:q;display:flex;flex-direction:column;gap:11px}
.q-list li{display:grid;grid-template-columns:24px 1fr;gap:11px;font-size:13.5px;
  line-height:1.6;color:var(--ink-2);list-style:none}
.q-list li::before{counter-increment:q;content:counter(q);width:24px;height:24px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;
  font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.q-list{padding:0;margin:0}
.kbd-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;
  align-items:center;color:var(--ink-2)}
kbd{font-family:Archivo,monospace;font-size:10.5px;font-weight:700;padding:2.5px 6px;
  border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--panel-2);
  color:var(--ink);white-space:nowrap}
.src{font-size:12px;line-height:1.65;color:var(--ink-2)}
.src li{margin-bottom:6px}

/* ============ sunum modu ============ */
body.present .panel{display:none}
body.present .app{grid-template-columns:minmax(0,1fr)}
body.present .topbar .tools .hide-p{display:none}

/* ============ dar ekran ============ */
@media (max-width:900px){
  body{overflow:auto}
  html,body{height:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto auto auto}
  .topbar{grid-column:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    padding-left:16px;padding-right:16px}
  .stage{grid-column:1;grid-row:2;aspect-ratio:4/3;max-height:62vh}
  .timeline{grid-column:1;grid-row:3;overflow-x:auto;padding-left:16px;padding-right:16px}
  .tl-track{min-width:520px}
  .tl-nav{display:none}
  .panel{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--rule);
    overflow:visible}
  .panel-scroll{overflow:visible;padding:18px 16px 40px}
  .legend{max-width:184px}
  .legend .lg-foot{display:none}
  body.present .panel{display:block}
  body.present .app{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .brand h1{font-size:16px}
  .brand .sub{display:none}
  .stage{aspect-ratio:1/1;max-height:56vh}
  .ov-bl .legend{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

function smooth(pts){
  if(pts.length<3) return "M"+pts.map(p=>p.join(",")).join("L");
  let d="M"+pts[0].join(",");
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i?i-1:0], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} `+
       `${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  return d;
}

/* ================= yakınlaştırma ================= */
function vis(){
  const r=stageEl.getBoundingClientRect();
  const s=Math.max(r.width/W,r.height/H);
  const vw=r.width/s, vh=r.height/s;
  return {vw,vh,vx:(W-vw)/2,vy:(H-vh)/2,s,rw:r.width,rh:r.height};
}
/* haritanın tamamının sığdığı en küçük ölçek — geniş ekranda İtalya kırpılmasın */
function minK(){const v=vis();return Math.min(1,v.vw/W,v.vh/H);}
function clamp(){
  const v=vis(), mk=minK();
  state.k=Math.max(mk,Math.min(16,state.k));
  const cw=state.k*W, ch=state.k*H;
  state.tx = cw<=v.vw ? v.vx+(v.vw-cw)/2
           : Math.min(v.vx,Math.max(v.vx+v.vw-cw,state.tx));
  state.ty = ch<=v.vh ? v.vy+(v.vh-ch)/2
           : Math.min(v.vy,Math.max(v.vy+v.vh-ch,state.ty));
}
let lastK=0;
function apply(){
  clamp();
  Z.setAttribute("transform",`translate(${state.tx.toFixed(2)},${state.ty.toFixed(2)}) scale(${state.k.toFixed(4)})`);
  if(Math.abs(state.k-lastK)>1e-4){
    lastK=state.k;
    const inv=1/state.k;
    Z.querySelectorAll(".cs").forEach(n=>{
      const r=n.dataset.rot;
      n.setAttribute("transform",`translate(${n.dataset.x},${n.dataset.y}) scale(${inv})`+
        (r&&r!=="0"?` rotate(${r})`:""));
    });
    svg.style.setProperty("--lf",(4/state.k).toFixed(3));
    const iv=1/state.k;
    gWall.setAttribute("transform",
      `translate(${(2.4*iv).toFixed(2)},${(9*iv).toFixed(2)})`);
    gHi.setAttribute("transform",
      `translate(${(-1.1*iv).toFixed(2)},${(-2.4*iv).toFixed(2)})`);
    svg.classList.toggle("z1",state.k>=1.22);
    svg.classList.toggle("z2",state.k>=2.0);
    scaleBar();
  }
}
function centerLat(){
  const v=vis();
  const cy=((v.vy+v.vh/2)-state.ty)/state.k;
  const my=MY1-cy/SC;
  return Math.atan(Math.exp(my*Math.PI/180))*360/Math.PI-90;
}
function scaleBar(){
  const kmPerUnit=111.32*Math.cos(centerLat()*Math.PI/180)/SC;
  const v=vis();
  const pxPerUnit=v.s*state.k;
  const targetPx=90;
  let km=targetPx/pxPerUnit*kmPerUnit;
  const steps=[10,25,50,100,200,250,500,1000,2000];
  let pick=steps[0];
  for(const s of steps) if(s<=km) pick=s;
  const w=pick/kmPerUnit*pxPerUnit;
  $("#scaleBar").style.width=Math.max(30,w).toFixed(0)+"px";
  $("#scaleTxt").textContent=pick>=1000?(pick/1000)+" bin km":pick+" km";
}
function fitGeo(b,animate){
  const v=vis(); state.fitted=false;
  const x0=PX(b[0]),x1=PX(b[2]),y0=PY(b[3]),y1=PY(b[1]);
  const k=Math.max(minK(),Math.min(16,Math.min(v.vw/(x1-x0),v.vh/(y1-y0))*.94));
  go(k,(v.vx+v.vw/2)-k*(x0+x1)/2,(v.vy+v.vh/2)-k*(y0+y1)/2,animate);
}
function go(k,tx,ty,animate){
  if(!animate||matchMedia("(prefers-reduced-motion: reduce)").matches){
    state.k=k;state.tx=tx;state.ty=ty;apply();return;
  }
  cancelAnimationFrame(state.anim);
  const k0=state.k,x0=state.tx,y0=state.ty,t0=performance.now(),D=560;
  (function step(t){
    const u=Math.min(1,(t-t0)/D), e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    state.k=k0+(k-k0)*e; state.tx=x0+(tx-x0)*e; state.ty=y0+(ty-y0)*e; apply();
    if(u<1) state.anim=requestAnimationFrame(step);
  })(t0);
}
function zoomAt(f,cx,cy){
  state.fitted=false;
  const v=vis(), r=stageEl.getBoundingClientRect();
  const px=v.vx+(cx-r.left)/v.s, py=v.vy+(cy-r.top)/v.s;
  const k=Math.max(minK(),Math.min(16,state.k*f));
  state.tx=px-(px-state.tx)*(k/state.k);
  state.ty=py-(py-state.ty)*(k/state.k);
  state.k=k; apply();
}
function resetView(a){const v=vis(),k=minK(); state.fitted=true;
  go(k,v.vx+(v.vw-k*W)/2,v.vy+(v.vh-k*H)/2,a);}

/* etkileşim */
let drag=null;
svg.addEventListener("pointerdown",e=>{
  if(e.button!==0&&e.pointerType==="mouse") return;
  drag={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty,moved:0};
  svg.setPointerCapture(e.pointerId); svg.classList.add("drag");
});
svg.addEventListener("pointermove",e=>{
  if(!drag) return;
  const v=vis();
  drag.moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
  if(drag.moved>4) state.fitted=false;
  state.tx=drag.tx+(e.clientX-drag.x)/v.s; state.ty=drag.ty+(e.clientY-drag.y)/v.s;
  apply();
});
let lastMoved=0;
["pointerup","pointercancel"].forEach(t=>svg.addEventListener(t,()=>{
  lastMoved=drag?drag.moved:0; drag=null; svg.classList.remove("drag");
}));
svg.addEventListener("wheel",e=>{e.preventDefault();
  zoomAt(e.deltaY<0?1.16:1/1.16,e.clientX,e.clientY);},{passive:false});
let pinch=null;
svg.addEventListener("touchmove",e=>{
  if(e.touches.length!==2) return; e.preventDefault();
  const[a,b]=e.touches, d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const cx=(a.clientX+b.clientX)/2, cy=(a.clientY+b.clientY)/2;
  if(pinch) zoomAt(d/pinch,cx,cy);
  pinch=d; drag=null;
},{passive:false});
svg.addEventListener("touchend",()=>{pinch=null;});
function relayout(){lastK=0; if(state.fitted) resetView(0); else apply();}

function curOwner(u){
  const st=STAGES[state.stage];
  return (st.own&&st.own[u])||BASE[u]||"oth";
}
function applyStage(i,animate){
  state.stage=i; state.sel=null;
  const st=STAGES[i];

  for(const id in PATHS){
    const e=ENT[curOwner(id)]||ENT.oth;
    PATHS[id].setAttribute("class","terr"+(U[id]?" hit":"")+" "+e.c+
      (state.sel&&state.sel.t==="u"&&state.sel.id===id?" on":""));
  }
  gClaim.textContent="";
  if(st.claim) ["lby_tr","lby_bn","lby_fz"].forEach(id=>{
    if(GEO.units[id]) el("path",{d:GEO.units[id].d},gClaim);});

  gZone.textContent="";
  st.zones.forEach(z=>el("circle",{cx:PX(z[0]).toFixed(1),cy:PY(z[1]).toFixed(1),
    r:(z[2]*SC).toFixed(1),class:"zone"},gZone));
  gRez.textContent="";
  st.rez.forEach(z=>el("circle",{cx:PX(z[0]).toFixed(1),cy:PY(z[1]).toFixed(1),
    r:(z[2]*SC).toFixed(1),class:"rzone"},gRez));

  for(const id in EVG) EVG[id].style.display=st.evs.includes(id)?"":"none";

  for(const k in st.lay) if(!state.manual[k]) state.layers[k]=st.lay[k];
  syncLayers(); buildLegend();

  document.querySelectorAll(".tl-step").forEach((b,j)=>{
    b.setAttribute("aria-current",j===i?"true":"false");
    b.classList.toggle("done",j<i);
  });
  $("#tlPrev").disabled=i===0; $("#tlNext").disabled=i===STAGES.length-1;
  markSel(); renderStage();
  if(animate) apply();
}

    <div class="owner-tag">${swFor(own)}${esc(e.n)}</div>
    <div class="body-txt">${m.tx||"<p>—</p>"}</div>`;
  panel.scrollTop=0;
}
function renderEv(id){
  const e=EV[id]; state.sel={t:"e",id}; markSel();
  panel.innerHTML=`${backBtn()}
    <div class="eyebrow">Olay</div><h2>${esc(e.n)}</h2>
    <div class="date-line">${esc(e.d)}</div>
    <div class="body-txt"><p>${e.t}</p></div>`;
  panel.scrollTop=0;
}
function renderRoute(i){
  const r=ROUTES[i]; state.sel=null; markSel();
  panel.innerHTML=`${backBtn()}
    <div class="eyebrow">${r.k==="navy"?"Donanma harekâtı":"Kara yolu"}</div>
    <h2>${esc(r.n)}</h2><div class="body-txt"><p>${r.t}</p></div>`;
  panel.scrollTop=0;
}
function markSel(){
  gLand.querySelectorAll(".terr.on").forEach(n=>n.classList.remove("on"));
  gEv.querySelectorAll(".ev.on").forEach(n=>n.classList.remove("on"));
  if(!state.sel) return;
  if(state.sel.t==="u"&&PATHS[state.sel.id]){
    PATHS[state.sel.id].classList.add("on"); raise(PATHS[state.sel.id]);
  }
  if(state.sel.t==="e"&&EVG[state.sel.id]) EVG[state.sel.id].classList.add("on");
}
panel.addEventListener("click",e=>{
  if(e.target.closest("[data-back]")){state.sel=null;markSel();renderStage();return;}
  const g=e.target.closest("[data-go]");
  if(g){const id=g.dataset.go, p=EV[id].p;
    fitGeo([p[0]-2.6,p[1]-1.8,p[0]+2.6,p[1]+1.8],1); renderEv(id);}
});
function hit(e){
  const ev=e.target.closest("[data-e]"); if(ev){renderEv(ev.dataset.e);return;}
  const rt=e.target.closest("[data-r]"); if(rt){renderRoute(+rt.dataset.r);return;}
  const u=e.target.closest("[data-u]");
  if(u&&U[u.dataset.u]) renderUnit(u.dataset.u);
}
svg.addEventListener("click",e=>{if(lastMoved<6) hit(e);});
svg.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();hit(e);}
});

/* ================= örtü sayfalar ================= */
const sheet=$("#sheet");
let lastFocus=null;
function openSheet(title,html){
  lastFocus=document.activeElement;
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html;
  sheet.hidden=false; $("#sheetX").focus();
}
function closeSheet(){sheet.hidden=true; if(lastFocus) lastFocus.focus();}
$("#sheetX").onclick=closeSheet;
sheet.addEventListener("click",e=>{if(e.target===sheet) closeSheet();});

/* ================= üst şerit ================= */
$("#btnPresent").onclick=function(){
  const on=document.body.classList.toggle("present");
  this.setAttribute("aria-pressed",on?"true":"false");
  setTimeout(relayout,30);
};
(function theme(){
  let t=null; try{t=localStorage.getItem("tg-theme");}catch(e){}
  if(t) document.documentElement.setAttribute("data-theme",t);
  $("#btnTheme").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="dark"?"light":cur==="light"?"dark":
      (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("tg-theme",next);}catch(e){}
  };
})();

/* ================= klavye ================= */
addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea")) return;
  const k=e.key;
  if(k==="Escape"){ if(!sheet.hidden) closeSheet();
    else if(state.sel){state.sel=null;markSel();renderStage();} return;}
  if(!sheet.hidden) return;
  if(k==="ArrowRight"){applyStage(Math.min(STAGES.length-1,state.stage+1));e.preventDefault();}
  else if(k==="ArrowLeft"){applyStage(Math.max(0,state.stage-1));e.preventDefault();}
  else if(k>="1"&&k<="6"){applyStage(Math.min(STAGES.length-1,+k-1));}
  else if(k==="+"||k==="="){const r=stageEl.getBoundingClientRect();
    zoomAt(1.55,r.left+r.width/2,r.top+r.height/2);}
  else if(k==="-"||k==="_"){const r=stageEl.getBoundingClientRect();
    zoomAt(1/1.55,r.left+r.width/2,r.top+r.height/2);}
  else if(k==="0"){resetView(1);}
  else if(k==="s"||k==="S"){$("#btnPresent").click();}
  else if(k==="k"||k==="K"){$("#btnPeople").click();}
  else if(k==="n"||k==="N"){$("#btnNotes").click();}
  else if(k==="l"||k==="L"){$("#btnLayers").click();}
});

/* ================= başlat ================= */
resetView(0);
applyStage(0);
apply();
requestAnimationFrame(()=>requestAnimationFrame(()=>svg.classList.remove("boot")));
</script>
